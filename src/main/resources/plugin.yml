name: ChaosSMP
version: 1.1.0
main: ru.chaossmp.ChaosSMP
api-version: '1.21'
description: Chaos SMP spawn, statistics and leaderboards
author: ChaosSMP
commands:
  spawn:
    description: Teleport to server spawn
    usage: /spawn
  setspawn:
    description: Set server spawn
    usage: /setspawn
    permission: chaossmp.setspawn
  stats:
    description: Show player statistics
    usage: /stats [player]
  top:
    description: Show a leaderboard
    usage: /top <kills|deaths|streak|playtime>
permissions:
  chaossmp.setspawn:
    description: Allows setting the server spawn
    default: op
